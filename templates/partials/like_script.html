<script>
// Likes update in place; without JS the link still works (server redirects back).
document.addEventListener('click', function (e) {
  var btn = e.target.closest('.js-like');
  if (!btn) return;
  e.preventDefault();
  if (btn.dataset.busy) return;
  btn.dataset.busy = '1';
  fetch(btn.href, { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (data) {
      var liked = data.action === 'liked';
      btn.classList.toggle('liked', liked);
      btn.setAttribute('aria-pressed', liked ? 'true' : 'false');
      btn.querySelector('.js-like-count').textContent = data.likes;
      btn.classList.add('pop');
      setTimeout(function () { btn.classList.remove('pop'); }, 250);
    })
    .catch(function () { window.location.href = btn.href; })
    .finally(function () { delete btn.dataset.busy; });
});
</script>
