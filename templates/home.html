{% extends 'base.html' %}
{% block title %}Home{% endblock title %}
{% block content %}
<div class="wrap">
  <section class="card card-pad home-card stack reveal">
    <img class="close-btn" src="https://cdn-icons-png.flaticon.com/512/5030/5030354.png" alt="">
    <a href="/" style="align-self:center"><img src="https://cdn-icons-png.flaticon.com/512/1384/1384075.png" alt="" width="72" height="72"></a>
    {% if user.is_authenticated %}
    <h1 class="page-title">Hello <span class="gradient-text">{{ user.username }}</span></h1>
    <a class="btn btn-primary" href="{% url 'profile' %}">Profile</a>
    <a class="btn btn-ghost" href="{% url 'Feeds Page' %}">Feed</a>
    <a class="btn btn-ghost" href="{% url 'Explore Page' %}">Explore Users</a>
    <a class="btn btn-ghost" href="{% url 'Logout Request' %}">Logout</a>
    {% else %}
    <a href="{% url 'Login Page' %}"><h1 class="page-title">Not Logged in<br><span class="gradient-text">Click to Log In</span></h1></a>
    {% endif %}
  </section>
</div>
{% endblock content %}
